---
ansible_user: admin
ansible_password: admin
ansible_network_os: arista.eos.eos
# Configure privilege escalation
ansible_become: true
ansible_become_method: enable
# HTTPAPI configuration
ansible_connection: httpapi
ansible_httpapi_port: 443
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false
ansible_python_interpreter: $(which python3)

custom_structured_configuration_prefix:
  - 'csc_'

# Local Users
aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      sha512_password: "$6$WIJu6JlXvlQ.u3Ft$1.drgTLjST0D2rgKJsR9BbsY2NhH2HD868nr0Mc1wXXTGonYKodtPXG/Lwei1f5g3kWPMEfg7QjVtZctOJ.2w/"
    - name: service # used for auto_config_cvp
      privilege: 15
      role: network-admin
      shell: "/bin/bash"
      sha512_password: "$6$4Ey4qpC8elLHIA2a$GRrcdzVU1anXhn5FrAAEtsPg0zdnEHCza4tHVqTCGFV4XFme7Tl8SRGy.Xe0NA7A8XktXr1ZtNzAoBwzm18Nb0"
  authorization:
    exec:
      default: local

ntp_settings:
  servers:
    - name: 129.6.15.28
    - name: 129.6.15.29

timezone: "America/Detroit"

dns_settings:
  servers:
    - ip_address: 1.1.1.1

# OOB Management network default gateway.
# Comment out the mgmt_gateway for ACT.  Default route will be 10.18.x.x for access
# out of ACT environment.
# mgmt_gateway: 192.168.0.1
mgmt_interface: Management1
# mgmt_interface_vrf: default

ssh_settings:
  # Explicitly enable or disable management ssh for all VRFs. By default EOS enables management ssh for all VRFs.
  enabled: true
  vrfs:

      # VRF name.
      # The value will be interpreted according to these rules:
      # - `use_mgmt_interface_vrf` will configure SSH for the VRF set with `mgmt_interface_vrf`.
      #   An error will be raised if `mgmt_ip` or `ipv6_mgmt_ip` are not configured for the device.
      # - `use_inband_mgmt_vrf` will configure SSH for the VRF set with `inband_mgmt_vrf`.
      #   An error will be raised if inband management is not configured for the device.
      # - `use_default_mgmt_method_vrf` will configure the VRF for one of the two options above depending on the value of `default_mgmt_method`.
      # - Any other string will be used directly as the VRF name.
    - name: use_mgmt_interface_vrf

      # Enable SSH in VRF.
      enabled: true

csc_management_api_http:
  enable_vrfs:
    - name: MGMT

fabric_ip_addressing:
  mlag:
    algorithm: "same_subnet"

p2p_uplinks_mtu: 1500

cv_settings:
  cvaas:
    enabled: true
    clusters:
      - name: cvaas
        region: "staging"
  terminattr:
    ingestexclude: "/Sysdb/cell/1/agent,/Sysdb/cell/2/agent"
    disable_aaa: true

generate_cv_tags:
  topology_hints: true