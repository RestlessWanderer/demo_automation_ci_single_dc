!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$WIJu6JlXvlQ.u3Ft$1.drgTLjST0D2rgKJsR9BbsY2NhH2HD868nr0Mc1wXXTGonYKodtPXG/Lwei1f5g3kWPMEfg7QjVtZctOJ.2w/
username service privilege 15 role network-admin shell /bin/bash secret sha512 $6$4Ey4qpC8elLHIA2a$GRrcdzVU1anXhn5FrAAEtsPg0zdnEHCza4tHVqTCGFV4XFme7Tl8SRGy.Xe0NA7A8XktXr1ZtNzAoBwzm18Nb0
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.cv-staging.corp.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname spine-2
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 1.1.1.1
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 4096
!
clock timezone America/Detroit
!
vlan 110
   name DC1_DATA_110
!
vlan 120
   name DC1_DATA_120
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel1
   description L2_DC1-LEAF1_Port-Channel1
   no shutdown
   switchport trunk allowed vlan 110,120
   switchport mode trunk
   switchport
   mlag 1
!
interface Port-Channel3
   description L2_DC1-LEAF2_Port-Channel1
   no shutdown
   switchport trunk allowed vlan 110,120
   switchport mode trunk
   switchport
   mlag 3
!
interface Port-Channel47
   description MLAG_spine-1_Port-Channel47
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description L2_leaf-1a_Ethernet2
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_leaf-1b_Ethernet2
   no shutdown
   channel-group 1 mode active
!
interface Ethernet3
   description L2_leaf-2a_Ethernet2
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description L2_leaf-2b_Ethernet2
   no shutdown
   channel-group 3 mode active
!
interface Ethernet47
   description MLAG_spine-1_Ethernet47
   no shutdown
   channel-group 47 mode active
!
interface Ethernet48
   description MLAG_spine-1_Ethernet48
   no shutdown
   channel-group 47 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.252.1.2/32
   ip ospf area 0.0.0.0
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.31.0.28/23
!
interface Vlan110
   description DC1_DATA_110
   no shutdown
   ip address 10.1.10.3/24
   ip virtual-router address 10.1.10.1
!
interface Vlan120
   description DC1_DATA_120
   no shutdown
   ip address 10.1.20.3/24
   ip virtual-router address 10.1.20.1
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 1500
   ip address 10.253.1.3/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.253.1.1/31
!
hardware tcam
   system profile vxlan-routing
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
no ip routing vrf MGMT
!
mlag configuration
   domain-id DC1-SPINES
   local-interface Vlan4094
   peer-address 10.253.1.0
   peer-link Port-Channel47
   reload-delay mlag 900
   reload-delay non-mlag 1020
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 129.6.15.28 prefer
ntp server vrf MGMT 129.6.15.29
!
router ospf 100
   router-id 10.252.1.2
   passive-interface default
   no passive-interface Vlan4093
   redistribute connected
   max-lsa 12000
!
end
