!
no enable password
no aaa root
!
username cvpadmin privilege 15 role network-admin secret sha512 $6$.mFLh0tGzdM/moiC$fqhGOO9gtXz.Zbor3SAu4D6fEX6HpZnq52dt145MvK4nEHr80xL0PECkltLe9s3F2P97L9iuQb3/KHuSFmkFW/
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=172.31.0.5:9910 -cvauth=token,/tmp/token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname leaf-2b
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 1.1.1.1
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 16384
!
clock timezone America/Detroit
!
vlan 110
   name DC1_DATA_110
!
vlan 120
   name CI_PIPELINE
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
   !
   vrf default
      no shutdown
!
interface Port-Channel1
   description L2_DC1-SPINES_Port-Channel3
   no shutdown
   switchport trunk allowed vlan 110,120
   switchport mode trunk
   switchport
   mlag 1
!
interface Port-Channel23
   description MLAG_leaf-2a_Port-Channel23
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description L2_spine-1_Ethernet4
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_spine-2_Ethernet4
   no shutdown
   channel-group 1 mode active
!
interface Ethernet23
   description MLAG_leaf-2a_Ethernet23
   no shutdown
   channel-group 23 mode active
!
interface Ethernet24
   description MLAG_leaf-2a_Ethernet24
   no shutdown
   channel-group 23 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.31.0.21/23
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.253.1.1/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id DC1-LEAF2
   local-interface Vlan4094
   peer-address 10.253.1.0
   peer-link Port-Channel23
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 129.6.15.28 prefer
ntp server vrf MGMT 129.6.15.29
!
end
