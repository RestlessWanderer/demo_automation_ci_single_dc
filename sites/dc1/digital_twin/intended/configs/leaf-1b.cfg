vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
   !
   vrf default
      no shutdown
!
interface Port-Channel1
   description L2_DC1-SPINES_Port-Channel1
   no shutdown
   switchport trunk allowed vlan 20-75,110,120,1000-2000
   switchport mode trunk
   switchport
   mlag 1
!
interface Port-Channel47
   description MLAG_leaf-1a_Port-Channel47
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description L2_spine-1_Ethernet2
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description L2_spine-2_Ethernet2
   no shutdown
   channel-group 1 mode active
!
interface Ethernet47
   description MLAG_leaf-1a_Ethernet47
   no shutdown
   channel-group 47 mode active
!
interface Ethernet48
   description MLAG_leaf-1a_Ethernet48
   no shutdown
   channel-group 47 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.31.0.23/23
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.253.1.1/31
