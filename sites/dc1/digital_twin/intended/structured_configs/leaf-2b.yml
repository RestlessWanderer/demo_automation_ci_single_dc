aaa_accounting:
  dot1x:
    default:
      type: start-stop
      methods:
      - multicast: false
        method: group
        group: radius
aaa_authentication:
  dot1x:
    default: group DOT1X
aaa_root:
  disabled: true
aaa_server_groups:
- name: DOT1X
  type: radius
  servers:
  - server: 1.1.1.1
    vrf: MGMT
clock:
  timezone: America/Detroit
config_end: true
daemon_terminattr:
  cvaddrs:
  - 172.31.0.5:9910
  cvauth:
    method: token
    token_file: /tmp/token
  cvsourceintf: Management1
  cvvrf: MGMT
  disable_aaa: true
  ingestexclude: /Sysdb/cell/1/agent,/Sysdb/cell/2/agent
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
dot1x:
  system_auth_control: true
  protocol_lldp_bypass: true
  protocol_bpdu_bypass: true
  dynamic_authorization: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet23
  description: MLAG_leaf-2a_Ethernet23
  shutdown: false
  channel_group:
    id: 23
    mode: active
  metadata:
    peer: leaf-2a
    peer_interface: Ethernet23
    peer_type: mlag_peer
- name: Ethernet24
  description: MLAG_leaf-2a_Ethernet24
  shutdown: false
  channel_group:
    id: 23
    mode: active
  metadata:
    peer: leaf-2a
    peer_interface: Ethernet24
    peer_type: mlag_peer
- name: Ethernet1
