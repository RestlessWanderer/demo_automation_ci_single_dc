    id: 1
    mode: active
  metadata:
    peer: spine-2
    peer_interface: Ethernet4
    peer_type: l3spine
- name: Ethernet3
  shutdown: false
  dot1x:
    port_control: auto
    reauthentication: true
    pae:
      mode: authenticator
    authentication_failure:
      action: allow
      allow_vlan: 999
    host_mode:
      mode: multi-host
      multi_host_authenticated: true
    mac_based_authentication:
      enabled: true
    timeout:
      reauth_period: server
      tx_period: 3
    reauthorization_request_limit: 3
  spanning_tree_portfast: edge
  metadata:
