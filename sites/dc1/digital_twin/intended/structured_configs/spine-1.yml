    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: leaf-2a
    description: leaf-2a_Ethernet1
  - ip_address: 100.100.1.13
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65102'
    metadata:
      peer: leaf-2b
    description: leaf-2b_Ethernet1
  - ip_address: 10.252.1.3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: leaf-1a
    description: leaf-1a_Loopback0
  - ip_address: 10.252.1.4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65101'
    metadata:
      peer: leaf-1b
    description: leaf-1b_Loopback0
  - ip_address: 10.252.1.5
    peer_group: EVPN-OVERLAY-PEERS
