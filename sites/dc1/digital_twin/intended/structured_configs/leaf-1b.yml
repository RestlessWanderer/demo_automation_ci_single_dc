aaa_root:
  disabled: true
clock:
  timezone: America/Detroit
config_end: true
daemon_terminattr:
  cvaddrs:
  - 172.31.0.5:9910
  cvauth:
    method: token
    token_file: /tmp/token
  cvsourceintf: Management1
  cvvrf: MGMT
  disable_aaa: true
  ingestexclude: /Sysdb/cell/1/agent,/Sysdb/cell/2/agent
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet47
  description: MLAG_leaf-1a_Ethernet47
  shutdown: false
  channel_group:
    id: 47
    mode: active
  peer: leaf-1a
  peer_interface: Ethernet47
  peer_type: mlag_peer
- name: Ethernet48
  description: MLAG_leaf-1a_Ethernet48
  shutdown: false
  channel_group:
    id: 47
    mode: active
  peer: leaf-1a
  peer_interface: Ethernet48
  peer_type: mlag_peer
- name: Ethernet1
  description: L2_spine-1_Ethernet2
  shutdown: false
  channel_group:
    id: 1
    mode: active
  peer: spine-1
  peer_interface: Ethernet2
  peer_type: l3spine
- name: Ethernet2
  description: L2_spine-2_Ethernet2
  shutdown: false
  channel_group:
    id: 1
    mode: active
  peer: spine-2
  peer_interface: Ethernet2
  peer_type: l3spine
hostname: leaf-1b
ip_domain_lookup:
  source_interfaces:
  - name: Management1
    vrf: MGMT
ip_igmp_snooping:
  globally_enabled: true
ip_name_servers:
- ip_address: 1.1.1.1
  vrf: MGMT
local_users:
- name: cvpadmin
  privilege: 15
  role: network-admin
  sha512_password: $6$.mFLh0tGzdM/moiC$fqhGOO9gtXz.Zbor3SAu4D6fEX6HpZnq52dt145MvK4nEHr80xL0PECkltLe9s3F2P97L9iuQb3/KHuSFmkFW/
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
  - name: default
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.31.0.48/23
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: dc1_fabric
  cv_tags:
    device_tags:
    - name: topology_hint_fabric
      value: dc1_fabric
    - name: topology_hint_type
      value: leaf
    - name: topology_hint_rack
      value: DC1-LEAF1
  digital_twin:
    environment: act
    node_type: veos
    ip_addr: 172.31.0.48/23
    version: 4.33.4M
    username: cvpadmin
    password: cvp123!
mlag_configuration:
  domain_id: DC1-LEAF1
  local_interface: Vlan4094
  peer_address: 10.253.1.0
  peer_link: Port-Channel47
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: 129.6.15.28
    preferred: true
    vrf: MGMT
  - name: 129.6.15.29
    vrf: MGMT
port_channel_interfaces:
- name: Port-Channel47
  description: MLAG_leaf-1a_Port-Channel47
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel1
  description: L2_DC1-SPINES_Port-Channel1
  shutdown: false
  mlag: 1
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 110,120
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 16384
  no_spanning_tree_vlan: '4094'
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.253.1.1/31
  mtu: 1500
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  tenant: system
- id: 110
  name: DC1_DATA_110
  tenant: DC1
- id: 120
  name: DC1_DATA_120
  tenant: DC1
vrfs:
- name: MGMT
  ip_routing: false
